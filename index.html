<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍅 番茄爆炸</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 20px;
            background: radial-gradient(ellipse at center, #120820 0%, #080610 100%);
            font-family: 'ZCOOL KuaiLe', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            user-select: none;
        }

        /* ── 有界容器（卡片） ── */
        #app {
            position: relative;
            width: 680px;
            height: 560px;
            overflow: hidden;
            border-radius: 28px;
            background: radial-gradient(ellipse at 50% 30%, #1e0d38 0%, #0a0715 100%);
            box-shadow: 0 16px 72px rgba(0,0,0,0.92), 0 0 0 1px rgba(255,180,100,0.14), inset 0 0 60px rgba(120,40,200,0.06);
        }

        /* ── 顶部分数栏（胶囊）── */
        #hud {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            background: rgba(12, 5, 26, 0.62);
            border: 1px solid rgba(255, 185, 105, 0.18);
            border-radius: 64px;
            padding: 10px 4px;
            backdrop-filter: blur(18px);
            z-index: 100;
            box-shadow: 0 2px 24px rgba(0,0,0,0.5), 0 0 0 0.5px rgba(255,155,80,0.08);
        }
        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 22px;
            gap: 2px;
        }
        .hud-item.hud-center { padding: 0 30px; }
        .hud-divider {
            width: 1px;
            height: 30px;
            background: rgba(255, 185, 105, 0.16);
        }
        .hud-val {
            font-size: 22px;
            color: #FFCC80;
            line-height: 1;
        }
        .hud-item.hud-center .hud-val {
            font-size: 28px;
            color: #FF9D60;
        }
        .hud-lbl {
            font-size: 11px;
            color: rgba(255, 195, 120, 0.45);
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        /* ── HUD 浮动动画 ── */
        @keyframes hud-float-a {
            0%,100% { transform: translateY(0px); }
            50%     { transform: translateY(-5px); }
        }
        @keyframes hud-float-b {
            0%,100% { transform: translateY(0px); }
            50%     { transform: translateY(-4px); }
        }
        @keyframes hud-float-c {
            0%,100% { transform: translateY(0px); }
            50%     { transform: translateY(-6px); }
        }
        .hud-item { animation: hud-float-a 3.4s ease-in-out infinite; }
        .hud-item.hud-center { animation: hud-float-b 2.8s ease-in-out infinite 0.5s; }
        .hud-item:last-child { animation: hud-float-c 3.1s ease-in-out infinite 1.1s; }

        /* ── 番茄容器 ── */
        #tomato-wrap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            filter: drop-shadow(0 0 30px rgba(255,60,40,0.6));
            transition: filter 0.3s;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        #tomato-wrap:hover {
            filter: drop-shadow(0 0 50px rgba(255,120,60,0.98));
        }
        /* ── 番茄 SVG ── */
        #tomato-svg {
            width: 150px;
            height: 150px;
            display: block;
        }

        /* ── 摇晃动画 ── */
        @keyframes shake {
            0%,100% { transform: translate(0,0) rotate(0deg); }
            20%     { transform: translate(-6px,-4px) rotate(-4deg); }
            40%     { transform: translate(6px,4px)  rotate(4deg); }
            60%     { transform: translate(-5px,3px) rotate(-3deg); }
            80%     { transform: translate(5px,-3px) rotate(3deg); }
        }
        .shaking { animation: shake 0.35s ease !important; }

        /* ── 粒子 canvas ── */
        #canvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 50;
        }

        /* ── 容器震动 ── */
        @keyframes screenShake {
            0%,100% { transform: translate(0,0); }
            15%     { transform: translate(-5px,-3px); }
            30%     { transform: translate(5px,3px); }
            45%     { transform: translate(-4px,3px); }
            60%     { transform: translate(4px,-3px); }
            75%     { transform: translate(-3px,2px); }
        }
        .screen-shaking { animation: screenShake 0.35s ease; }

        /* ── 分数弹出 ── */
        .score-popup {
            position: absolute;
            font-size: 26px;
            font-weight: 400;
            color: #FFE8A0;
            text-shadow: 0 0 14px rgba(255,170,50,0.9), 0 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 200;
            animation: popUp 0.9s ease-out forwards;
        }
        @keyframes popUp {
            0%   { opacity: 1; transform: translateY(0) scale(1); }
            70%  { opacity: 1; transform: translateY(-50px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-80px) scale(0.8); }
        }

        /* ── 豆芽 ── */
        /* ── 豆芽 ── */
        #sprout-wrap {
            position: absolute;
            bottom: 0px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 10;
            display: flex;
            gap: 18px;
            align-items: flex-end;
        }
        .sprout {
            pointer-events: auto;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transform-origin: bottom center;
            animation: sprout-dance1 2.6s ease-in-out infinite;
        }
        .sprout:nth-child(2) {
            animation-name: sprout-dance2;
            animation-duration: 2.1s;
            animation-delay: -0.7s;
        }
        .sprout:nth-child(3) {
            animation-name: sprout-dance3;
            animation-duration: 1.9s;
            animation-delay: -1.3s;
        }
        .sprout-jumping {
            animation: sprout-jump 0.5s cubic-bezier(0.22,1.2,0.36,1) forwards !important;
        }
        @keyframes sprout-jump {
            0%   { transform: scaleX(1.2)  scaleY(0.7) translateY(0);     }
            25%  { transform: scaleX(0.85) scaleY(1.3) translateY(-40px) rotate(-10deg); }
            55%  { transform: scaleX(0.9)  scaleY(1.2) translateY(-52px) rotate(12deg);  }
            75%  { transform: scaleX(1.05) scaleY(0.95) translateY(-20px) rotate(-4deg); }
            90%  { transform: scaleX(1.1)  scaleY(0.8) translateY(-4px)  rotate(2deg);  }
            100% { transform: scaleX(1)    scaleY(1)   translateY(0)     rotate(0deg);  }
        }

        /* 豆芽1：扭腰跳跃 */
        @keyframes sprout-dance1 {
            0%   { transform: rotate(-6deg) translateY(0);    }
            15%  { transform: rotate(4deg)  translateY(-8px); }
            30%  { transform: rotate(-8deg) translateY(-14px);}
            45%  { transform: rotate(6deg)  translateY(-6px); }
            60%  { transform: rotate(-4deg) translateY(-10px);}
            75%  { transform: rotate(7deg)  translateY(-4px); }
            100% { transform: rotate(-6deg) translateY(0);    }
        }
        /* 豆芽2：弹跳点头 */
        @keyframes sprout-dance2 {
            0%   { transform: translateY(0)     scaleY(1)    rotate(0deg);  }
            20%  { transform: translateY(-16px) scaleY(1.08) rotate(-5deg); }
            35%  { transform: translateY(-4px)  scaleY(0.95) rotate(3deg);  }
            55%  { transform: translateY(-20px) scaleY(1.1)  rotate(5deg);  }
            70%  { transform: translateY(-2px)  scaleY(0.93) rotate(-4deg); }
            85%  { transform: translateY(-10px) scaleY(1.04) rotate(2deg);  }
            100% { transform: translateY(0)     scaleY(1)    rotate(0deg);  }
        }
        /* 豆芽3：左右蹦跳 */
        @keyframes sprout-dance3 {
            0%   { transform: rotate(5deg)  translateY(0);    }
            20%  { transform: rotate(-9deg) translateY(-12px);}
            40%  { transform: rotate(7deg)  translateY(-18px);}
            55%  { transform: rotate(-5deg) translateY(-8px); }
            70%  { transform: rotate(8deg)  translateY(-14px);}
            85%  { transform: rotate(-6deg) translateY(-4px); }
            100% { transform: rotate(5deg)  translateY(0);    }
        }

        /* ── 音符 ── */
        #music-note {
            position: absolute;
            bottom: 12px;
            left: calc(50% + 90px);
            font-size: 22px;
            pointer-events: none;
            z-index: 11;
            animation: note-bounce 1.8s ease-in-out infinite;
            transform-origin: bottom center;
        }
        @keyframes note-bounce {
            0%,100% { transform: translateY(0)    rotate(-10deg) scale(1);    opacity: 0.65; }
            40%     { transform: translateY(-18px) rotate(8deg)  scale(1.25);  opacity: 1;    }
            70%     { transform: translateY(-7px)  rotate(-5deg) scale(0.95);  opacity: 0.8;  }
        }

        /* ── 连击提示 ── */
        #combo {
            position: absolute;
            bottom: 162px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
            font-weight: 800;
            color: #ff9f43;
            text-shadow: 0 0 16px #ff6b35;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            letter-spacing: 2px;
            white-space: nowrap;
            z-index: 100;
        }
    </style>
</head>

<script>
(() => {
    const app    = document.getElementById('app');
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');
    const wrap   = document.getElementById('tomato-wrap');
    const svg    = document.getElementById('tomato-svg');
    const countEl = document.getElementById('count');
    const scoreEl = document.getElementById('score');
    const maxEl   = document.getElementById('maxCombo');
    const comboEl = document.getElementById('combo');

    // Canvas tracks container size
    let W, H;
    const resize = () => {
        W = canvas.width  = app.offsetWidth;
        H = canvas.height = app.offsetHeight;
    };
    resize();
    new ResizeObserver(resize).observe(app);

    // Convert client coords to container-local coords
    const toLocal = (cx, cy) => {
        const r = app.getBoundingClientRect();
        return { x: cx - r.left, y: cy - r.top };
    };

    let explosions = 0, totalScore = 0, combo = 0, maxCombo = 0;
    let comboTimer = null;
    let particles = [], shockwaves = [];

    class Particle {
        constructor(x, y, type) {
            this.x = x; this.y = y; this.type = type;
            const speed = type === 'spark' ? 6 + Math.random()*14
                        : type === 'juice' ? 3 + Math.random()*8
                        : 2 + Math.random()*7;
            const angle = Math.random() * Math.PI * 2;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed - (type === 'spark' ? 4 : 2);
            this.gravity = type === 'spark' ? 0.25 : 0.35;
            this.life = 1;
            const decay = { chunk: 0.018, juice: 0.025, seed: 0.022, spark: 0.03, soybean: 0.016, greenbean: 0.018 };
            this.decay = decay[type] + Math.random() * 0.012;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.2;
            this.trail = [];
            if (type === 'chunk') {
                const r = ['#e8321a','#c42010','#ff5533','#ff8060','#d62815','#a01008','#ff4422'];
                this.color = r[Math.floor(Math.random() * r.length)];
                this.size = 8 + Math.random() * 14;
            } else if (type === 'juice') {
                this.color = `hsla(${4 + Math.random()*16}, 90%, ${45+Math.random()*25}%, `;
                this.size = 3 + Math.random() * 6;
            } else if (type === 'seed') {
                this.color = '#f0d070';
                this.size = 4 + Math.random() * 4;
            } else if (type === 'soybean') {
                // 黄豆：饱满椭圆，米黄色
                this.color = Math.random() < 0.5 ? '#f0d060' : '#e8c840';
                this.hilite = 'rgba(255,255,200,0.55)';
                this.size = 6 + Math.random() * 5;
            } else if (type === 'greenbean') {
                // 绿豆：小圆豆，深绿/浅绿
                this.color = Math.random() < 0.5 ? '#4a9e30' : '#6ec244';
                this.hilite = 'rgba(180,255,120,0.45)';
                this.size = 4 + Math.random() * 4;
            } else {
                const hue = Math.random() < 0.5 ? 30 + Math.random()*30 : Math.random()*20;
                this.color = `hsl(${hue}, 100%, 75%)`;
                this.size = 2 + Math.random() * 4;
            }
        }
        update() {
            this.trail.push({ x: this.x, y: this.y });
            if (this.trail.length > 6) this.trail.shift();
            this.vx *= 0.97; this.vy += this.gravity;
            this.x += this.vx; this.y += this.vy;
            this.rotation += this.rotSpeed;
            this.life -= this.decay;
            if (this.y > H - 20 && this.vy > 0) {
                this.vy *= -0.35; this.vx *= 0.7;
                this.y = H - 20; this.decay += 0.04;
            }
        }
        draw(c) {
            c.save();
            c.globalAlpha = Math.max(0, this.life);
            if (this.type === 'spark') {
                if (this.trail.length > 1) {
                    c.beginPath();
                    c.moveTo(this.trail[0].x, this.trail[0].y);
                    for (let i = 1; i < this.trail.length; i++) c.lineTo(this.trail[i].x, this.trail[i].y);
                    c.lineTo(this.x, this.y);
                    c.strokeStyle = this.color; c.lineWidth = this.size * 0.6 * this.life; c.lineCap = 'round';
                    c.stroke();
                }
                c.beginPath();
                c.arc(this.x, this.y, Math.max(0, this.size * 0.5 * this.life), 0, Math.PI*2);
                c.fillStyle = '#fff'; c.fill();
            } else if (this.type === 'juice') {
                c.translate(this.x, this.y); c.rotate(Math.atan2(this.vy, this.vx));
                c.beginPath(); c.ellipse(0, 0, this.size*0.55, this.size*1.1, 0, 0, Math.PI*2);
                c.fillStyle = this.color + (this.life*0.85) + ')'; c.fill();
            } else if (this.type === 'seed') {
                c.translate(this.x, this.y); c.rotate(this.rotation);
                c.beginPath(); c.ellipse(0, 0, this.size*0.4, this.size*0.9, 0, 0, Math.PI*2);
                c.fillStyle = this.color; c.fill();
            } else if (this.type === 'soybean' || this.type === 'greenbean') {
                c.translate(this.x, this.y); c.rotate(this.rotation);
                // 豆子主体
                c.beginPath();
                c.ellipse(0, 0, this.size * 0.58, this.size * 0.72, 0, 0, Math.PI * 2);
                c.fillStyle = this.color; c.fill();
                c.strokeStyle = 'rgba(0,0,0,0.28)'; c.lineWidth = 0.8; c.stroke();
                // 高光
                c.beginPath();
                c.ellipse(-this.size*0.15, -this.size*0.2, this.size*0.22, this.size*0.16, -0.6, 0, Math.PI*2);
                c.fillStyle = this.hilite; c.fill();
            } else {
                c.translate(this.x, this.y); c.rotate(this.rotation);
                c.beginPath();
                const sides = 5 + Math.floor(Math.random()*3);
                const jitter = this.size * 0.35;
                for (let i = 0; i < sides; i++) {
                    const a = (i/sides)*Math.PI*2;
                    const r = this.size*(0.7+Math.random()*0.3);
                    const px = Math.cos(a)*r + (Math.random()-0.5)*jitter;
                    const py = Math.sin(a)*r + (Math.random()-0.5)*jitter;
                    i===0 ? c.moveTo(px,py) : c.lineTo(px,py);
                }
                c.closePath(); c.fillStyle = this.color; c.fill();
                c.beginPath(); c.arc(-this.size*0.2,-this.size*0.2,this.size*0.3,0,Math.PI*2);
                c.fillStyle = 'rgba(255,255,255,0.18)'; c.fill();
            }
            c.restore();
        }
    }

    class ShockWave {
        constructor(x, y) { this.x=x; this.y=y; this.r=10; this.life=1; }
        update() { this.r += 18; this.life -= 0.055; }
        draw(c) {
            c.save();
            c.globalAlpha = Math.max(0, this.life*0.7);
            c.beginPath(); c.arc(this.x,this.y,this.r,0,Math.PI*2);
            c.strokeStyle = 'hsl(15,100%,70%)'; c.lineWidth = 4*this.life; c.stroke();
            if (this.r > 50) {
                c.globalAlpha = Math.max(0, (this.life-0.3)*0.4);
                c.beginPath(); c.arc(this.x,this.y,this.r*0.6,0,Math.PI*2);
                c.strokeStyle = '#ff9966'; c.lineWidth = 2*this.life; c.stroke();
            }
            c.restore();
        }
    }

    // ── 番茄神经质移动 ──
    let tmX = 0, tmY = 0, tmR = 0;       // 当前插值位置
    let tmTX = 0, tmTY = 0, tmTR = 0;   // 目标
    let tmLerp = 0.04;
    let tmNextAt = 0;
    let frenzyUntil = 0;  // 发疯模式结束时间
    let frenzyTimer = null;

    function tickTomato(now) {
        const insane = now < frenzyUntil;
        if (now >= tmNextAt) {
            const crazy = insane || Math.random() < 0.44;
            const range = insane ? 110 : (crazy ? 72 : 26);
            tmTX = (Math.random() - 0.5) * range * 2;
            tmTY = (Math.random() - 0.5) * range * 2;
            tmTR = (Math.random() - 0.5) * (insane ? 90 : crazy ? 50 : 16);
            tmLerp = insane ? (0.35 + Math.random() * 0.45) : (crazy ? (0.15 + Math.random() * 0.3) : (0.022 + Math.random() * 0.038));
            tmNextAt = now + (insane ? 30 + Math.random() * 80 : crazy ? 60 + Math.random() * 220 : 700 + Math.random() * 2200);
        }
        tmX += (tmTX - tmX) * tmLerp;
        tmY += (tmTY - tmY) * tmLerp;
        tmR += (tmTR - tmR) * tmLerp;
        wrap.style.transform =
            `translate(calc(-50% + ${tmX.toFixed(2)}px), calc(-50% + ${tmY.toFixed(2)}px)) rotate(${tmR.toFixed(2)}deg)`;
    }

    // 发疯倒计时标签
    const frenzyLabel = (() => {
        const el = document.createElement('div');
        el.id = 'frenzy-label';
        el.style.cssText = `
            position:absolute; top:82px; left:calc(50% - 130px); transform:none;
            font-size:18px; font-weight:900; color:#ff3a10; letter-spacing:3px;
            text-shadow:0 0 16px #ff5500, 0 0 36px rgba(255,60,0,0.6);
            pointer-events:none; z-index:200; display:none;
            animation: frenzy-pulse 0.25s ease-in-out infinite alternate;
        `;
        el.textContent = '🤪 ！！！';
        app.appendChild(el);
        return el;
    })();

    // 在 <style> 里动态插入 frenzy-pulse keyframe
    const frenzyStyle = document.createElement('style');
    frenzyStyle.textContent = `@keyframes frenzy-pulse {
        from { transform: scale(1) rotate(-3deg); filter: hue-rotate(0deg); }
        to   { transform: scale(1.15) rotate(3deg); filter: hue-rotate(60deg); }
    }`;
    document.head.appendChild(frenzyStyle);

    function startFrenzy(now) {
        frenzyUntil = now + 5000;
        frenzyLabel.style.display = 'block';
        clearTimeout(frenzyTimer);
        // 倒计时更新
        let remaining = 5;
        const tick = () => {
            frenzyLabel.textContent = `🤪 ！！！${remaining}s`;
            remaining--;
            if (remaining >= 0) frenzyTimer = setTimeout(tick, 1000);
            else { frenzyLabel.style.display = 'none'; }
        };
        tick();
        // 发疯音效：高速噪声扫频
        sndFrenzy();
    }

    function sndFrenzy() {
        resume();
        const t = ac.currentTime;
        const osc = ac.createOscillator(); osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(80, t);
        osc.frequency.linearRampToValueAtTime(800, t + 0.4);
        osc.frequency.exponentialRampToValueAtTime(200, t + 0.8);
        osc.frequency.linearRampToValueAtTime(1200, t + 1.2);
        const g = ac.createGain(); g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
        const dist = ac.createWaveShaper();
        const curve = new Float32Array(256);
        for (let i = 0; i < 256; i++) { const x = (i * 2) / 256 - 1; curve[i] = (Math.PI + 200) * x / (Math.PI + 200 * Math.abs(x)); }
        dist.curve = curve;
        osc.connect(dist); dist.connect(g); g.connect(ac.destination);
        osc.start(t); osc.stop(t + 1.4);
    }

    const loop = (now) => {
        ctx.clearRect(0, 0, W, H);
        particles  = particles.filter(p  => { p.update();  p.draw(ctx);  return p.life > 0; });
        shockwaves = shockwaves.filter(s => { s.update(); s.draw(ctx); return s.life > 0; });
        tickTomato(now);
        requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);

    const explode = (lx, ly) => {
        for (let i=0;i<28;i++) particles.push(new Particle(lx,ly,'chunk'));
        for (let i=0;i<40;i++) particles.push(new Particle(lx,ly,'juice'));
        for (let i=0;i<14;i++) particles.push(new Particle(lx,ly,'seed'));
        for (let i=0;i<50;i++) particles.push(new Particle(lx,ly,'spark'));
        shockwaves.push(new ShockWave(lx,ly));
        console.log(`%c🍅 BOOM #${explosions+1}`, 'color:#ff4422;font-size:16px;font-weight:bold;');
    };

    const shakeContainer = () => {
        app.classList.remove('screen-shaking');
        void app.offsetWidth;
        app.classList.add('screen-shaking');
        app.addEventListener('animationend', () => app.classList.remove('screen-shaking'), { once: true });
    };

    const showScorePopup = (lx, ly, pts) => {
        const el = document.createElement('div');
        el.className = 'score-popup';
        el.textContent = `+${pts}`;
        el.style.left = (lx - 20) + 'px';
        el.style.top  = (ly - 30) + 'px';
        app.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
    };

    const handleCombo = () => {
        combo++;
        if (combo > maxCombo) { maxCombo = combo; maxEl.textContent = maxCombo; }
        clearTimeout(comboTimer);
        if (combo >= 2) {
            comboEl.textContent = `${combo}x COMBO 🔥`;
            comboEl.style.opacity = '1';
            comboEl.style.fontSize = Math.min(36, 20 + combo*2) + 'px';
        }
        comboTimer = setTimeout(() => {
            combo = 0;
            comboEl.style.opacity = '0';
        }, 1500);
    };

    // 被点到时立即惊吓乱窜，30% 触发发疯5s
    const scareTomato = (now) => { tmNextAt = 0; tmLerp = 0.35; if (Math.random() < 0.3 && now < frenzyUntil === false) startFrenzy(now); };

    wrap.addEventListener('click', (e) => {
        scareTomato(performance.now());
        sndExplode();
        const rect = svg.getBoundingClientRect();
        const local = toLocal(rect.left + rect.width/2, rect.top + rect.height/2);

        svg.classList.remove('shaking'); void svg.offsetWidth; svg.classList.add('shaking');
        svg.addEventListener('animationend', () => svg.classList.remove('shaking'), { once: true });
        svg.style.transition = 'transform 0.08s ease';
        svg.style.transform  = 'scale(0.75)';
        setTimeout(() => { svg.style.transform=''; svg.style.transition=''; }, 80);

        shakeContainer();
        explode(local.x, local.y);
        handleCombo();

        explosions++;
        const pts = 10 * (combo || 1);
        totalScore += pts;
        countEl.textContent = explosions;
        scoreEl.textContent  = totalScore;
        showScorePopup(...Object.values(toLocal(e.clientX, e.clientY)), pts);
    });

    app.addEventListener('click', (e) => {
        if (wrap.contains(e.target)) return;
        const local = toLocal(e.clientX, e.clientY);
        for (let i=0;i<12;i++) particles.push(new Particle(local.x,local.y,'spark'));
        for (let i=0;i<6;i++)  particles.push(new Particle(local.x,local.y,'juice'));
        sndSpark();
    });

    // ── 音效引擎（Web Audio API） ──
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const resume = () => { if (ac.state === 'suspended') ac.resume(); };

    // 番茄爆炸音：低频噼啪 + 短噪声冲击
    function sndExplode() {
        resume();
        const t = ac.currentTime;
        // 冲击噪声
        const buf = ac.createBuffer(1, ac.sampleRate * 0.18, ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.5);
        const src = ac.createBufferSource(); src.buffer = buf;
        const flt = ac.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = 400;
        const g = ac.createGain(); g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        src.connect(flt); flt.connect(g); g.connect(ac.destination); src.start(t);
        // 低音 thud
        const osc = ac.createOscillator(); osc.type = 'sine';
        osc.frequency.setValueAtTime(160, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
        const g2 = ac.createGain(); g2.gain.setValueAtTime(0.5, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.connect(g2); g2.connect(ac.destination); osc.start(t); osc.stop(t + 0.15);
    }

    // 豆芽点击音：竖琴版「小星星」~10s 循环
    const _harp = { alive: false, stop: null };

    function sndBoing() {
        resume();
        if (_harp.stop) { _harp.stop(); }

        const rLen = Math.floor(ac.sampleRate * 2.2);
        const rBuf = ac.createBuffer(2, rLen, ac.sampleRate);
        for (let ch = 0; ch < 2; ch++) {
            const d = rBuf.getChannelData(ch);
            for (let i = 0; i < rLen; i++)
                d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / rLen, 1.9);
        }

        const e = 0.5; // 四分音符时值（120 BPM），20 × e = 10s

        // 小星星（C大调，四分音符索引）
        // [频率Hz, 四分音符起点, 延音秒, 音量]
        const SEQ = [
            // "Twinkle twinkle little star"
            [261.63,  0, 0.38, 0.85],  // C4
            [261.63,  1, 0.38, 0.85],  // C4
            [392.00,  2, 0.38, 0.90],  // G4
            [392.00,  3, 0.38, 0.90],  // G4
            [440.00,  4, 0.38, 0.95],  // A4
            [440.00,  5, 0.38, 0.95],  // A4
            [392.00,  6, 0.85, 1.00],  // G4 star（二拍）
            // "How I wonder what you are"
            [349.23,  8, 0.38, 0.85],  // F4
            [349.23,  9, 0.38, 0.85],  // F4
            [329.63, 10, 0.38, 0.80],  // E4
            [329.63, 11, 0.38, 0.80],  // E4
            [293.66, 12, 0.38, 0.85],  // D4
            [293.66, 13, 0.38, 0.85],  // D4
            [261.63, 14, 0.85, 1.00],  // C4 are（二拍）
            // 收尾琶音过渡（衔接循环）
            [261.63, 16, 0.22, 0.55],  // C4
            [329.63, 17, 0.22, 0.62],  // E4
            [392.00, 18, 0.22, 0.68],  // G4
            [523.25, 19, 0.70, 0.78],  // C5 归位
        ];

        _harp.alive = true;
        const allNodes = [];

        function playOnce() {
            if (!_harp.alive) return;
            const t0 = ac.currentTime + 0.03;
            const rev = ac.createConvolver(); rev.buffer = rBuf;
            const revG = ac.createGain(); revG.gain.value = 0.38;
            rev.connect(revG); revG.connect(ac.destination);

            SEQ.forEach(([freq, qi, extra, v]) => {
                const onset = t0 + qi * e;
                const decayT = extra + 0.4;
                [[freq, 'triangle', 0.22], [freq * 2, 'sine', 0.06]].forEach(([f, type, amp]) => {
                    const osc = ac.createOscillator(); osc.type = type; osc.frequency.value = f;
                    const g = ac.createGain();
                    g.gain.setValueAtTime(0, onset);
                    g.gain.linearRampToValueAtTime(amp * v, onset + 0.008);
                    g.gain.exponentialRampToValueAtTime(0.0001, onset + decayT);
                    osc.connect(g); g.connect(ac.destination); g.connect(rev);
                    osc.start(onset); osc.stop(onset + decayT + 0.1);
                    allNodes.push(osc);
                });
            });

            // 播放一次，不循环
            _harp.stop = () => {
                _harp.alive = false;
                const now = ac.currentTime;
                allNodes.forEach(n => { try { n.stop(now); } catch (_) {} });
                _harp.stop = null;
            };
        }

        playOnce();
    }

    // 空白处点击：小火花音
    function sndSpark() {
        resume();
        const t = ac.currentTime;
        const osc = ac.createOscillator(); osc.type = 'square';
        osc.frequency.setValueAtTime(1200 + Math.random() * 600, t);
        osc.frequency.exponentialRampToValueAtTime(400, t + 0.06);
        const g = ac.createGain(); g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
        osc.connect(g); g.connect(ac.destination); osc.start(t); osc.stop(t + 0.06);
    }

    // 豆芽被点击时爆出黄豆和绿豆
    document.querySelectorAll('.sprout').forEach(sprout => {
        sprout.addEventListener('click', (e) => {
            e.stopPropagation();
            const rect = sprout.getBoundingClientRect();
            const local = toLocal(rect.left + rect.width / 2, rect.top + rect.height / 2);
            for (let i = 0; i < 10; i++) particles.push(new Particle(local.x, local.y, 'soybean'));
            for (let i = 0; i < 10; i++) particles.push(new Particle(local.x, local.y, 'greenbean'));
            for (let i = 0; i < 8;  i++) particles.push(new Particle(local.x, local.y, 'spark'));
            sndBoing();
            // 用跳跃动画类代替 inline style
            sprout.classList.remove('sprout-jumping');
            void sprout.offsetWidth;
            sprout.classList.add('sprout-jumping');
            sprout.addEventListener('animationend', () => sprout.classList.remove('sprout-jumping'), { once: true });
        });
    });
})();
</script>
</body>
</html>
