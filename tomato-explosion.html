<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍅 番茄爆炸</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
        }

        /* ── 有界容器（卡片） ── */
        #app {
            position: relative;
            width: 680px;
            height: 560px;
            overflow: hidden;
            border-radius: 20px;
            background: radial-gradient(ellipse at center, #1a0a2e 0%, #0d0d1a 100%);
            box-shadow: 0 8px 48px rgba(0,0,0,0.8), 0 0 0 1.5px rgba(255,100,80,0.18);
        }

        /* ── 顶部分数栏 ── */
        #hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        .hud-card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,100,80,0.3);
            border-radius: 12px;
            padding: 6px 18px;
            text-align: center;
            backdrop-filter: blur(6px);
        }
        .hud-label { font-size: 10px; color: rgba(255,200,180,0.7); letter-spacing: 2px; text-transform: uppercase; }
        .hud-value { font-size: 22px; font-weight: 700; color: #ff6b5b; line-height: 1.2; }

        /* ── 提示文字 ── */
        #hint {
            position: absolute;
            bottom: 128px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,200,180,0.45);
            font-size: 13px;
            letter-spacing: 1px;
            pointer-events: none;
            white-space: nowrap;
        }

        /* ── 番茄容器 ── */
        #tomato-wrap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            filter: drop-shadow(0 0 30px rgba(255,60,40,0.6));
            transition: filter 0.3s;
        }
        #tomato-wrap:hover {
            filter: drop-shadow(0 0 50px rgba(255,80,50,0.95));
        }
        #tomato-wrap:active { transform: translate(-50%, -50%) scale(0.93); }

        /* ── 番茄 SVG ── */
        #tomato-svg {
            width: 150px;
            height: 150px;
            animation: float 3s ease-in-out infinite;
            display: block;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50%       { transform: translateY(-12px) rotate(2deg); }
        }

        /* ── 摇晃动画 ── */
        @keyframes shake {
            0%,100% { transform: translate(0,0) rotate(0deg); }
            20%     { transform: translate(-6px,-4px) rotate(-4deg); }
            40%     { transform: translate(6px,4px)  rotate(4deg); }
            60%     { transform: translate(-5px,3px) rotate(-3deg); }
            80%     { transform: translate(5px,-3px) rotate(3deg); }
        }
        .shaking { animation: shake 0.35s ease !important; }

        /* ── 粒子 canvas ── */
        #canvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 50;
        }

        /* ── 容器震动 ── */
        @keyframes screenShake {
            0%,100% { transform: translate(0,0); }
            15%     { transform: translate(-5px,-3px); }
            30%     { transform: translate(5px,3px); }
            45%     { transform: translate(-4px,3px); }
            60%     { transform: translate(4px,-3px); }
            75%     { transform: translate(-3px,2px); }
        }
        .screen-shaking { animation: screenShake 0.35s ease; }

        /* ── 分数弹出 ── */
        .score-popup {
            position: absolute;
            font-size: 26px;
            font-weight: 900;
            color: #ffe066;
            text-shadow: 0 0 12px #ff9900, 0 2px 2px rgba(0,0,0,0.6);
            pointer-events: none;
            z-index: 200;
            animation: popUp 0.9s ease-out forwards;
        }
        @keyframes popUp {
            0%   { opacity: 1; transform: translateY(0) scale(1); }
            70%  { opacity: 1; transform: translateY(-50px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-80px) scale(0.8); }
        }

        /* ── 豆芽 ── */
        #sprout-wrap {
            position: absolute;
            bottom: 38px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 10;
            display: flex;
            gap: 18px;
            align-items: flex-end;
        }
        .sprout {
            transform-origin: bottom center;
            animation: sway 2.8s ease-in-out infinite;
        }
        .sprout:nth-child(2) { animation-delay: -0.9s; animation-duration: 3.2s; }
        .sprout:nth-child(3) { animation-delay: -1.8s; animation-duration: 2.5s; }
        @keyframes sway {
            0%,100% { transform: rotate(-5deg); }
            50%     { transform: rotate(5deg); }
        }

        /* ── 豆芽 ── */
        #sprout-wrap {
            position: absolute;
            bottom: 0px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 10;
            display: flex;
            gap: 18px;
            align-items: flex-end;
        }
        .sprout {
            transform-origin: bottom center;
            animation: sway 2.8s ease-in-out infinite;
        }
        .sprout:nth-child(2) { animation-delay: -0.9s; animation-duration: 3.2s; }
        .sprout:nth-child(3) { animation-delay: -1.8s; animation-duration: 2.5s; }
        @keyframes sway {
            0%,100% { transform: rotate(-5deg); }
            50%     { transform: rotate(5deg); }
        }

        /* ── 连击提示 ── */
        #combo {
            position: absolute;
            top: 96px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
            font-weight: 800;
            color: #ff9f43;
            text-shadow: 0 0 16px #ff6b35;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            letter-spacing: 2px;
            white-space: nowrap;
            z-index: 100;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="hud">
        <div class="hud-card">
            <div class="hud-label">爆炸次数</div>
            <div class="hud-value" id="count">0</div>
        </div>
        <div class="hud-card">
            <div class="hud-label">总分</div>
            <div class="hud-value" id="score">0</div>
        </div>
        <div class="hud-card">
            <div class="hud-label">最大连击</div>
            <div class="hud-value" id="maxCombo">0</div>
        </div>
    </div>

    <div id="combo"></div>

    <div id="tomato-wrap">
        <svg id="tomato-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="tg" cx="38%" cy="32%" r="65%">
                    <stop offset="0%"   stop-color="#ff8c6a"/>
                    <stop offset="40%"  stop-color="#e8321a"/>
                    <stop offset="100%" stop-color="#8b1000"/>
                </radialGradient>
                <radialGradient id="shine" cx="35%" cy="28%" r="30%">
                    <stop offset="0%"  stop-color="rgba(255,255,255,0.55)"/>
                    <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
                </radialGradient>
                <filter id="soft">
                    <feGaussianBlur stdDeviation="1.5"/>
                </filter>
            </defs>
            <ellipse cx="100" cy="178" rx="52" ry="10" fill="rgba(0,0,0,0.3)" filter="url(#soft)"/>
            <circle cx="100" cy="108" r="75" fill="url(#tg)"/>
            <ellipse cx="78" cy="80" rx="28" ry="20" fill="url(#shine)"/>
            <circle cx="68" cy="74" r="7" fill="rgba(255,255,255,0.25)"/>
            <ellipse cx="100" cy="178" rx="18" ry="6" fill="rgba(80,0,0,0.25)"/>
            <path d="M100 36 C98 28 90 18 84 14" stroke="#2d7a1f" stroke-width="4.5" stroke-linecap="round" fill="none"/>
            <path d="M100 36 C112 22 126 24 128 32 C118 30 108 38 100 36Z" fill="#3dba28"/>
            <path d="M100 36 C88 20 72 22 70 32  C80 30 92 38 100 36Z" fill="#4dd634"/>
            <path d="M100 36 C105 18 118 12 124 18 C114 20 106 32 100 36Z" fill="#2ea01e"/>
            <path d="M100 36 C95 16 82 10 76 16  C86 18 96 32 100 36Z" fill="#57e040"/>
            <path d="M100 36 C102 24 112 20 116 24 C110 26 103 33 100 36Z" fill="#5af048"/>
            <path d="M100 36 C114 23 125 25 126 30" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            <path d="M100 108 C100 60 100 60 100 40" stroke="rgba(80,0,0,0.12)" stroke-width="2" fill="none"/>
            <path d="M100 108 C130 75 140 70 140 55" stroke="rgba(80,0,0,0.1)" stroke-width="1.5" fill="none"/>
            <path d="M100 108 C70 75 60 70 60 55"   stroke="rgba(80,0,0,0.1)" stroke-width="1.5" fill="none"/>
        </svg>
    </div>

    <!-- 豆芽装饰 -->
    <div id="sprout-wrap">
        <!-- 豆芽 1（矮） -->
        <svg class="sprout" width="36" height="72" viewBox="0 0 36 72" xmlns="http://www.w3.org/2000/svg">
            <!-- 茎 -->
            <path d="M18 70 C18 55 16 42 18 28" stroke="#7ec850" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <!-- 弯钩 -->
            <path d="M18 28 C18 16 26 10 30 14" stroke="#7ec850" stroke-width="3" stroke-linecap="round" fill="none"/>
            <!-- 头豆 -->
            <ellipse cx="30" cy="13" rx="5.5" ry="5" fill="#c8e86a" stroke="#8dbf3a" stroke-width="1"/>
            <ellipse cx="30" cy="11.5" rx="3" ry="2" fill="rgba(255,255,255,0.3)"/>
            <!-- 小叶 -->
            <path d="M18 42 C10 36 6 40 8 46 C12 46 16 44 18 42Z" fill="#5dc93a" opacity="0.85"/>
            <!-- 根 -->
            <ellipse cx="18" cy="71" rx="7" ry="2.5" fill="rgba(100,180,50,0.25)"/>
        </svg>
        <!-- 豆芽 2（高） -->
        <svg class="sprout" width="40" height="88" viewBox="0 0 40 88" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 86 C20 68 18 50 20 32" stroke="#6dbb40" stroke-width="4" stroke-linecap="round" fill="none"/>
            <path d="M20 32 C20 18 30 10 35 15" stroke="#6dbb40" stroke-width="3.5" stroke-linecap="round" fill="none"/>
            <ellipse cx="35" cy="14" rx="6.5" ry="6" fill="#d4ef72" stroke="#88c030" stroke-width="1.2"/>
            <ellipse cx="35" cy="12" rx="3.5" ry="2.2" fill="rgba(255,255,255,0.32)"/>
            <!-- 两片小叶 -->
            <path d="M20 54 C10 46 5 52 8 58 C13 59 18 56 20 54Z" fill="#52c230" opacity="0.9"/>
            <path d="M20 40 C28 33 33 37 31 43 C27 44 22 41 20 40Z" fill="#52c230" opacity="0.75"/>
            <ellipse cx="20" cy="87" rx="8" ry="3" fill="rgba(100,180,50,0.25)"/>
        </svg>
        <!-- 豆芽 3（矮偏） -->
        <svg class="sprout" width="32" height="64" viewBox="0 0 32 64" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 62 C16 50 14 38 15 24" stroke="#90d458" stroke-width="3" stroke-linecap="round" fill="none"/>
            <path d="M15 24 C14 14 6 8 3 12" stroke="#90d458" stroke-width="2.8" stroke-linecap="round" fill="none"/>
            <ellipse cx="3" cy="11" rx="5" ry="4.5" fill="#bfe860" stroke="#78b830" stroke-width="1"/>
            <ellipse cx="3" cy="9.5" rx="2.6" ry="1.8" fill="rgba(255,255,255,0.28)"/>
            <path d="M16 40 C22 34 26 38 24 43 C21 44 17 42 16 40Z" fill="#68cc3a" opacity="0.8"/>
            <ellipse cx="16" cy="63" rx="6" ry="2" fill="rgba(100,180,50,0.22)"/>
        </svg>
    </div>

    <canvas id="canvas"></canvas>
    <div id="hint">点击番茄 · 快速连击可获得连击奖励</div>
</div>

<script>
(() => {
    const app    = document.getElementById('app');
    const canvas = document.getElementById('canvas');
    const ctx    = canvas.getContext('2d');
    const wrap   = document.getElementById('tomato-wrap');
    const svg    = document.getElementById('tomato-svg');
    const countEl = document.getElementById('count');
    const scoreEl = document.getElementById('score');
    const maxEl   = document.getElementById('maxCombo');
    const comboEl = document.getElementById('combo');

    // Canvas tracks container size
    let W, H;
    const resize = () => {
        W = canvas.width  = app.offsetWidth;
        H = canvas.height = app.offsetHeight;
    };
    resize();
    new ResizeObserver(resize).observe(app);

    // Convert client coords to container-local coords
    const toLocal = (cx, cy) => {
        const r = app.getBoundingClientRect();
        return { x: cx - r.left, y: cy - r.top };
    };

    let explosions = 0, totalScore = 0, combo = 0, maxCombo = 0;
    let comboTimer = null;
    let particles = [], shockwaves = [];

    class Particle {
        constructor(x, y, type) {
            this.x = x; this.y = y; this.type = type;
            const speed = type === 'spark' ? 6 + Math.random()*14
                        : type === 'juice' ? 3 + Math.random()*8
                        : 2 + Math.random()*7;
            const angle = Math.random() * Math.PI * 2;
            this.vx = Math.cos(angle) * speed;
            this.vy = Math.sin(angle) * speed - (type === 'spark' ? 4 : 2);
            this.gravity = type === 'spark' ? 0.25 : 0.35;
            this.life = 1;
            const decay = { chunk: 0.018, juice: 0.025, seed: 0.022, spark: 0.03 };
            this.decay = decay[type] + Math.random() * 0.012;
            this.rotation = Math.random() * Math.PI * 2;
            this.rotSpeed = (Math.random() - 0.5) * 0.2;
            this.trail = [];
            if (type === 'chunk') {
                const r = ['#e8321a','#c42010','#ff5533','#ff8060','#d62815','#a01008','#ff4422'];
                this.color = r[Math.floor(Math.random() * r.length)];
                this.size = 8 + Math.random() * 14;
            } else if (type === 'juice') {
                this.color = `hsla(${4 + Math.random()*16}, 90%, ${45+Math.random()*25}%, `;
                this.size = 3 + Math.random() * 6;
            } else if (type === 'seed') {
                this.color = '#f0d070';
                this.size = 4 + Math.random() * 4;
            } else {
                const hue = Math.random() < 0.5 ? 30 + Math.random()*30 : Math.random()*20;
                this.color = `hsl(${hue}, 100%, 75%)`;
                this.size = 2 + Math.random() * 4;
            }
        }
        update() {
            this.trail.push({ x: this.x, y: this.y });
            if (this.trail.length > 6) this.trail.shift();
            this.vx *= 0.97; this.vy += this.gravity;
            this.x += this.vx; this.y += this.vy;
            this.rotation += this.rotSpeed;
            this.life -= this.decay;
            if (this.y > H - 20 && this.vy > 0) {
                this.vy *= -0.35; this.vx *= 0.7;
                this.y = H - 20; this.decay += 0.04;
            }
        }
        draw(c) {
            c.save();
            c.globalAlpha = Math.max(0, this.life);
            if (this.type === 'spark') {
                if (this.trail.length > 1) {
                    c.beginPath();
                    c.moveTo(this.trail[0].x, this.trail[0].y);
                    for (let i = 1; i < this.trail.length; i++) c.lineTo(this.trail[i].x, this.trail[i].y);
                    c.lineTo(this.x, this.y);
                    c.strokeStyle = this.color; c.lineWidth = this.size * 0.6 * this.life; c.lineCap = 'round';
                    c.stroke();
                }
                c.beginPath();
                c.arc(this.x, this.y, Math.max(0, this.size * 0.5 * this.life), 0, Math.PI*2);
                c.fillStyle = '#fff'; c.fill();
            } else if (this.type === 'juice') {
                c.translate(this.x, this.y); c.rotate(Math.atan2(this.vy, this.vx));
                c.beginPath(); c.ellipse(0, 0, this.size*0.55, this.size*1.1, 0, 0, Math.PI*2);
                c.fillStyle = this.color + (this.life*0.85) + ')'; c.fill();
            } else if (this.type === 'seed') {
                c.translate(this.x, this.y); c.rotate(this.rotation);
                c.beginPath(); c.ellipse(0, 0, this.size*0.4, this.size*0.9, 0, 0, Math.PI*2);
                c.fillStyle = this.color; c.fill();
            } else {
                c.translate(this.x, this.y); c.rotate(this.rotation);
                c.beginPath();
                const sides = 5 + Math.floor(Math.random()*3);
                const jitter = this.size * 0.35;
                for (let i = 0; i < sides; i++) {
                    const a = (i/sides)*Math.PI*2;
                    const r = this.size*(0.7+Math.random()*0.3);
                    const px = Math.cos(a)*r + (Math.random()-0.5)*jitter;
                    const py = Math.sin(a)*r + (Math.random()-0.5)*jitter;
                    i===0 ? c.moveTo(px,py) : c.lineTo(px,py);
                }
                c.closePath(); c.fillStyle = this.color; c.fill();
                c.beginPath(); c.arc(-this.size*0.2,-this.size*0.2,this.size*0.3,0,Math.PI*2);
                c.fillStyle = 'rgba(255,255,255,0.18)'; c.fill();
            }
            c.restore();
        }
    }

    class ShockWave {
        constructor(x, y) { this.x=x; this.y=y; this.r=10; this.life=1; }
        update() { this.r += 18; this.life -= 0.055; }
        draw(c) {
            c.save();
            c.globalAlpha = Math.max(0, this.life*0.7);
            c.beginPath(); c.arc(this.x,this.y,this.r,0,Math.PI*2);
            c.strokeStyle = 'hsl(15,100%,70%)'; c.lineWidth = 4*this.life; c.stroke();
            if (this.r > 50) {
                c.globalAlpha = Math.max(0, (this.life-0.3)*0.4);
                c.beginPath(); c.arc(this.x,this.y,this.r*0.6,0,Math.PI*2);
                c.strokeStyle = '#ff9966'; c.lineWidth = 2*this.life; c.stroke();
            }
            c.restore();
        }
    }

    const loop = () => {
        ctx.clearRect(0, 0, W, H);
        particles  = particles.filter(p  => { p.update();  p.draw(ctx);  return p.life > 0; });
        shockwaves = shockwaves.filter(s => { s.update(); s.draw(ctx); return s.life > 0; });
        requestAnimationFrame(loop);
    };
    loop();

    const explode = (lx, ly) => {
        for (let i=0;i<28;i++) particles.push(new Particle(lx,ly,'chunk'));
        for (let i=0;i<40;i++) particles.push(new Particle(lx,ly,'juice'));
        for (let i=0;i<14;i++) particles.push(new Particle(lx,ly,'seed'));
        for (let i=0;i<50;i++) particles.push(new Particle(lx,ly,'spark'));
        shockwaves.push(new ShockWave(lx,ly));
        console.log(`%c🍅 BOOM #${explosions+1}`, 'color:#ff4422;font-size:16px;font-weight:bold;');
    };

    const shakeContainer = () => {
        app.classList.remove('screen-shaking');
        void app.offsetWidth;
        app.classList.add('screen-shaking');
        app.addEventListener('animationend', () => app.classList.remove('screen-shaking'), { once: true });
    };

    const showScorePopup = (lx, ly, pts) => {
        const el = document.createElement('div');
        el.className = 'score-popup';
        el.textContent = `+${pts}`;
        el.style.left = (lx - 20) + 'px';
        el.style.top  = (ly - 30) + 'px';
        app.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
    };

    const handleCombo = () => {
        combo++;
        if (combo > maxCombo) { maxCombo = combo; maxEl.textContent = maxCombo; }
        clearTimeout(comboTimer);
        if (combo >= 2) {
            comboEl.textContent = `${combo}x COMBO 🔥`;
            comboEl.style.opacity = '1';
            comboEl.style.fontSize = Math.min(36, 20 + combo*2) + 'px';
        }
        comboTimer = setTimeout(() => {
            combo = 0;
            comboEl.style.opacity = '0';
        }, 1500);
    };

    wrap.addEventListener('click', (e) => {
        const rect = svg.getBoundingClientRect();
        const local = toLocal(rect.left + rect.width/2, rect.top + rect.height/2);

        svg.classList.remove('shaking'); void svg.offsetWidth; svg.classList.add('shaking');
        svg.addEventListener('animationend', () => svg.classList.remove('shaking'), { once: true });
        svg.style.transition = 'transform 0.08s ease';
        svg.style.transform  = 'scale(0.75)';
        setTimeout(() => { svg.style.transform=''; svg.style.transition=''; }, 80);

        shakeContainer();
        explode(local.x, local.y);
        handleCombo();

        explosions++;
        const pts = 10 * (combo || 1);
        totalScore += pts;
        countEl.textContent = explosions;
        scoreEl.textContent  = totalScore;
        showScorePopup(...Object.values(toLocal(e.clientX, e.clientY)), pts);
    });

    app.addEventListener('click', (e) => {
        if (wrap.contains(e.target)) return;
        const local = toLocal(e.clientX, e.clientY);
        for (let i=0;i<12;i++) particles.push(new Particle(local.x,local.y,'spark'));
        for (let i=0;i<6;i++)  particles.push(new Particle(local.x,local.y,'juice'));
    });
})();
</script>
</body>
</html>
